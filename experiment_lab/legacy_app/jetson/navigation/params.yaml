# CAD envelope of chassis, wheels and sensor bracket; physical tray is not included.
/d420_nav/planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.01
      use_astar: true
      allow_unknown: false
/d420_nav/controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.40
      lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 0.8
      min_lookahead_dist: 0.2
      max_lookahead_dist: 1.5
      transform_tolerance: 0.3
      rotate_to_heading_angular_vel: 0.15
      max_angular_accel: 0.3
      use_rotate_to_heading: true
      allow_reversing: false
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.02
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
/d420_nav/bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.3
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
/d420_nav/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    update_frequency: 2.0
    publish_frequency: 1.0
    transform_tolerance: 0.5
    resolution: 0.05
    track_unknown_space: true
    plugins:
    - static_layer
    - obstacle_layer
    - inflation_layer
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /map
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        marking: true
        clearing: true
        obstacle_min_range: 0.1
        obstacle_max_range: 16.0
        raytrace_min_range: 0.1
        raytrace_max_range: 16.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.5
      cost_scaling_factor: 3.0
    always_send_full_costmap: true
    footprint: '[[-0.210, -0.198], [0.272, -0.198], [0.272, 0.198], [-0.210, 0.198]]'
    footprint_padding: 0.01
/d420_nav/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.5
    rolling_window: true
    width: 8
    height: 8
    resolution: 0.05
    plugins:
    - obstacle_layer
    - inflation_layer
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        marking: true
        clearing: true
        obstacle_min_range: 0.1
        obstacle_max_range: 6.0
        raytrace_min_range: 0.1
        raytrace_max_range: 7.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.5
      cost_scaling_factor: 3.0
    always_send_full_costmap: true
    footprint: '[[-0.210, -0.198], [0.272, -0.198], [0.272, 0.198], [-0.210, 0.198]]'
    footprint_padding: 0.01
